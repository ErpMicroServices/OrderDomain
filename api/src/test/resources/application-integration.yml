spring:
  application:
    name: Order Domain Integration Tests

  # Disable Spring Cloud Config for tests
  cloud:
    config:
      enabled: false
    vault:
      enabled: false

  # Optional config import to prevent failures
  config:
    import: "optional:configserver:"

  # Integration test database configuration - uses real PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdb}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}   # pragma: allowlist secret
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  graphql:
    graphiql:
      enabled: false
    path: /graphql

  # OAuth2 security configuration for tests
  security:
    oauth2:
      client:
        registration:
          default:
            client-id: test-client-id
            client-secret: test-client-secret  # pragma: allowlist secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          default:
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://localhost:9000/oauth2/token
            user-info-uri: http://localhost:9000/oauth2/userInfo
            jwk-set-uri: http://localhost:9000/.well-known/jwks.json

# Integration test profile specific configuration
logging:
  level:
    org.springframework: INFO
    org.hibernate: INFO